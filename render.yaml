services:
  - type: web
    name: digitalization-grading-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: KEYCLOAK_BASE_URL
        sync: false
      - key: KEYCLOAK_REALM
        value: timetable-realm
      - key: KEYCLOAK_ISSUER_URI
        sync: false
      - key: KEYCLOAK_TOKEN_URL
        sync: false
      - key: KEYCLOAK_CLIENT_ID
        value: timetable-backend
      - key: KEYCLOAK_ADMIN_USERNAME
        sync: false
      - key: KEYCLOAK_ADMIN_PASSWORD
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "2525"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_SMTP_AUTH
        value: "true"
      - key: SPRING_MAIL_SMTP_STARTTLS_ENABLE
        value: "true"
      - key: APP_MAIL_ENABLED
        value: "false"
      - key: APP_MAIL_FROM_ADDRESS
        sync: false
      - key: APP_MAIL_FROM_NAME
        value: Digitalization of Grading and School Management
